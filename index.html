<title>Инфа 3д — Галерея проектов</title>
<style>
  :root {
    --bg: #0d1016;
    --surface: #151a24;
    --surface-2: #1b2230;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #edf1f7;
    --muted: #8f9bb3;
    --accent: #ff8a3d;
    --accent-soft: rgba(255, 138, 61, 0.14);
    --blue: #5aa9ff;
    --green: #4ade80;
    --radius: 14px;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: radial-gradient(circle at 18% 0%, #182032 0%, var(--bg) 52%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(16px);
    background: rgba(13, 16, 22, 0.88);
    border-bottom: 1px solid var(--border);
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    padding: 16px 24px;
  }
  .top-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat-pill {
    padding: 5px 11px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .stat-pill strong { color: var(--text); font-weight: 600; }
  .stat-pill.live { border-color: rgba(74, 222, 128, 0.35); color: #bdf7d0; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tab {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.16s ease;
  }
  .tab:hover { border-color: var(--border-strong); color: var(--text); }
  .tab.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: #ffd3b3;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .search {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    min-width: 215px;
    outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .btn {
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 8px 13px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .btn:hover { border-color: var(--accent); background: #222b3c; }
  .btn.primary {
    background: var(--accent-soft);
    border-color: rgba(255, 138, 61, 0.55);
    color: #ffd3b3;
  }
  .btn.live-on {
    border-color: rgba(74, 222, 128, 0.45);
    color: #bdf7d0;
  }
  input[type="file"] { display: none; }

  .toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 120;
    background: rgba(21, 26, 36, 0.96);
    border: 1px solid rgba(74, 222, 128, 0.55);
    color: #dcfce7;
    padding: 11px 16px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .banner {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(90, 169, 255, 0.09);
    border: 1px solid rgba(90, 169, 255, 0.25);
    font-size: 13px;
    color: #cde3ff;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  main { padding-bottom: 64px; }
  .topic-section { margin-top: 28px; }
  .topic-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .topic-title {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .topic-count { font-size: 13px; color: var(--muted); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--border-strong);
  }
  .preview-box {
    position: relative;
    background: #090b10;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .preview-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }
  .preview-box:hover img { transform: scale(1.03); }
  .multi-badge {
    position: absolute;
    right: 10px;
    bottom: 10px;
    background: rgba(13, 16, 22, 0.82);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .no-render {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px;
    cursor: default;
  }
  .thumbs {
    display: flex;
    gap: 6px;
    padding: 8px 12px 0;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .thumb {
    width: 52px;
    height: 38px;
    flex: 0 0 auto;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
    opacity: 0.72;
    transition: all 0.15s ease;
  }
  .thumb.active, .thumb:hover {
    opacity: 1;
    border-color: var(--accent);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-body {
    padding: 13px 15px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }
  .card-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .folder-link {
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
  }
  .folder-link:hover { color: var(--accent); }
  .files-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .chip.clickable { cursor: pointer; }
  .chip.clickable:hover { border-color: var(--accent); }
  .chip.blend { border-color: rgba(255, 138, 61, 0.35); color: #ffd2b2; }
  .chip.video { border-color: rgba(90, 169, 255, 0.38); color: #bfdcff; }
  .chip small { color: var(--muted); font-size: 11px; }

  .empty {
    text-align: center;
    padding: 64px 20px;
    color: var(--muted);
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(7, 9, 13, 0.94);
    backdrop-filter: blur(8px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lb-top {
    position: fixed;
    top: 14px;
    left: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 102;
    pointer-events: none;
  }
  .lb-meta {
    pointer-events: auto;
    background: rgba(21, 26, 36, 0.88);
    border: 1px solid var(--border-strong);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
  }
  .lb-actions {
    pointer-events: auto;
    display: flex;
    gap: 8px;
  }
  .lb-stage {
    position: relative;
    max-width: 94vw;
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .lb-stage img, .lb-stage video {
    max-width: 94vw;
    max-height: 80vh;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    object-fit: contain;
    background: #000;
  }
  .lb-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(21, 26, 36, 0.85);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 102;
  }
  .lb-nav:hover { border-color: var(--accent); color: var(--accent); }
  .lb-prev { left: 18px; }
  .lb-next { right: 18px; }

  @media (max-width: 768px) {
    header { position: static; }
    .wrap { padding: 12px 14px; }
    .top-row { gap: 8px; }
    h1 { font-size: 17px; gap: 8px; }
    .dot { width: 8px; height: 8px; }
    .stats { gap: 5px; font-size: 11.5px; }
    .stat-pill { padding: 3px 8px; }
    .controls { margin-top: 10px; gap: 8px; }
    .tabs {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      width: 100%;
      padding-bottom: 2px;
      gap: 6px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 6px 12px;
      font-size: 12.5px;
    }
    .actions { width: 100%; flex-wrap: nowrap; gap: 6px; }
    .search { flex: 1 1 auto; min-width: 0; font-size: 16px; padding: 7px 11px; }
    .btn { padding: 7px 10px; font-size: 12.5px; white-space: nowrap; flex: 0 0 auto; }
    .hide-sm { display: none; }
    .toast { left: 14px; right: 14px; bottom: 14px; text-align: center; }
  }

  @media (max-width: 640px) {
    .stat-updated { display: none; }
    main { padding-bottom: 40px; }
    .topic-section { margin-top: 18px; }
    .topic-header { margin-bottom: 12px; }
    .topic-title { font-size: 16px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .preview-box { aspect-ratio: 4 / 3; }
    .card-body { padding: 11px 13px 13px; gap: 8px; }
    .chip { max-width: 100%; font-size: 11.5px; }
    .lb-top { top: 10px; left: 10px; right: 10px; flex-wrap: wrap; gap: 6px; }
    .lb-meta { font-size: 12px; padding: 6px 10px; max-width: calc(100vw - 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-nav { width: 38px; height: 38px; font-size: 20px; }
    .lb-prev { left: 8px; }
    .lb-next { right: 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top-row">
      <h1><span class="dot"></span>Инфа 3д — Галерея проектов</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="controls">
      <div class="tabs" id="topic-tabs"></div>
      <div class="actions">
        <input type="search" id="search" class="search" placeholder="Поиск по теме, заданию..." />
        <button class="btn live-on" id="auto-btn" onclick="toggleAutoPoll()" title="Автоматически проверять новые файлы каждые 15 сек">🟢 <span class="hide-sm">Авто-обновление </span>(15с)</button>
        <button class="btn" onclick="refreshGallery(true)" title="Обновить галерею">↻<span class="hide-sm"> Обновить</span></button>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="content"></main>
<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()">
  <div class="lb-top">
    <div class="lb-meta" id="lb-meta"></div>
    <div class="lb-actions">
      <a class="btn" id="lb-open" href="#" target="_blank">Скачать<span class="hide-sm"> / открыть</span> ↗</a>
      <button class="btn" onclick="closeLightbox()">✕ Закрыть<span class="hide-sm"> (Esc)</span></button>
    </div>
  </div>
  <button class="lb-nav lb-prev" onclick="stepLightbox(-1)">‹</button>
  <div class="lb-stage" id="lb-stage"></div>
  <button class="lb-nav lb-next" onclick="stepLightbox(1)">›</button>
</div>

<script>
const IMG_RE = /\.(png|jpe?g|webp|gif)$/i;
const VID_RE = /\.(avi|mp4|mkv|mov|webm)$/i;
const BLEND_RE = /\.blend$/i;

let manifest = JSON.parse(document.getElementById("manifest-data").textContent);
let sourceLabel = location.protocol === "file:" ? "Локальный файл" : "GitHub Pages";
let activeTopic = "ALL";
let searchQuery = "";
let flatMedia = [];
let currentLbIndex = -1;
let lastSignature = "";
let autoPollEnabled = true;
let autoPollTimer = null;
let pendingManifestUpdate = false;

function manifestSignature(m) {
  if (!m || !Array.isArray(m.topics)) return "";
  return m.topics.map(t =>
    t.name + ":" + t.assignments.map(a =>
      a.name + "[" +
      [...a.images, ...a.blends, ...a.videos].map(f => `${f.name}|${f.size}|${f.mtime || ""}`).join(",") +
      "]"
    ).join(";")
  ).join("||");
}

function showToast(text) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 3600);
}

function updateAutoButton() {
  const btn = document.getElementById("auto-btn");
  if (!btn) return;
  if (autoPollEnabled) {
    btn.classList.add("live-on");
    btn.innerHTML = '🟢 <span class="hide-sm">Авто-обновление </span>(15с)';
  } else {
    btn.classList.remove("live-on");
    btn.innerHTML = '⚪ <span class="hide-sm">Авто-обновление: </span>выкл';
  }
}

function toggleAutoPoll() {
  autoPollEnabled = !autoPollEnabled;
  updateAutoButton();
  scheduleAutoPoll();
}

function scheduleAutoPoll() {
  clearInterval(autoPollTimer);
  if (!autoPollEnabled) return;
  autoPollTimer = setInterval(() => {
    refreshGallery(false);
  }, 15000);
}

function naturalNumKey(s) {
  const m = String(s).match(/(\d+(?:\.\d+)?)/);
  if (!m) return [999, 0, s];
  const parts = m[1].split(".").map(Number);
  return [parts[0] || 0, parts[1] || 0, s];
}
function cmpKey(a, b) {
  const ka = naturalNumKey(a), kb = naturalNumKey(b);
  if (ka[0] !== kb[0]) return ka[0] - kb[0];
  if (ka[1] !== kb[1]) return ka[1] - kb[1];
  return ka[2].localeCompare(kb[2], "ru");
}
function filePriority(assignName, fileName) {
  return String(assignName).startsWith("7.3") && String(fileName).toLowerCase().includes("майнкрафт") ? 0 : 1;
}
function cmpAssignFile(assignName, aName, bName) {
  const pa = filePriority(assignName, aName), pb = filePriority(assignName, bName);
  if (pa !== pb) return pa - pb;
  return aName.localeCompare(bName, "ru");
}
function fmtBytes(n) {
  if (n < 1024) return `${n} Б`;
  if (n < 1048576) return `${(n / 1024).toFixed(1)} КБ`;
  return `${(n / 1048576).toFixed(1)} МБ`;
}
function encodeSegments(relPath) {
  return relPath.split("/").map(encodeURIComponent).join("/");
}

async function loadFromGitHubLive(notifyOnChange = false) {
  let fetched = null;
  try {
    const res = await fetch(`manifest.json?_=${Date.now()}`, { cache: "no-store" });
    if (res.ok) {
      const m = await res.json();
      if (m && Array.isArray(m.topics)) fetched = m;
    }
  } catch {}

  if (!fetched) {
    if (!lastSignature) {
      lastSignature = manifestSignature(manifest);
      renderAll();
    }
    return;
  }

  const nextSig = manifestSignature(fetched);
  if (lastSignature && nextSig === lastSignature) return;

  const prevSig = lastSignature;
  manifest = fetched;
  sourceLabel = "GitHub Pages";
  lastSignature = nextSig;

  if (document.getElementById("lightbox").classList.contains("open")) {
    pendingManifestUpdate = true;
    if (notifyOnChange && prevSig) showToast("✨ Появились новые файлы! Обновятся после закрытия просмотра.");
    return;
  }
  renderAll();
  if (notifyOnChange && prevSig) showToast("✨ Появились новые файлы! Галерея обновлена.");
}

async function refreshGallery(manual = false) {
  if (location.protocol !== "file:") {
    await loadFromGitHubLive(true);
  } else if (manual) {
    location.reload();
  }
}

function renderAll() {
  const statsEl = document.getElementById("stats");
  const s = manifest.stats;
  statsEl.innerHTML = [
    `<span class="stat-pill live">● ${sourceLabel}</span>`,
    `<span class="stat-pill">Тем: <strong>${s.topics}</strong></span>`,
    `<span class="stat-pill">Работ: <strong>${s.assignments}</strong></span>`,
    `<span class="stat-pill">Рендеров: <strong>${s.renders}</strong></span>`,
    `<span class="stat-pill">.blend: <strong>${s.blends}</strong></span>`,
    s.videos ? `<span class="stat-pill">Видео: <strong>${s.videos}</strong></span>` : "",
    `<span class="stat-pill stat-updated">Обновлено: <strong>${manifest.generatedAt}</strong></span>`
  ].join("");

  const tabsEl = document.getElementById("topic-tabs");
  const tabList = [{ id: "ALL", label: `Все (${s.assignments})` }].concat(
    manifest.topics.map(t => ({ id: t.name, label: `${t.name} (${t.assignments.length})` }))
  );
  tabsEl.innerHTML = tabList.map(t =>
    `<button class="tab ${activeTopic === t.id ? "active" : ""}" onclick="selectTopic('${t.id.replace(/'/g, "\\'")}')">${t.label}</button>`
  ).join("");

  const q = searchQuery.trim().toLowerCase();
  const contentEl = document.getElementById("content");
  flatMedia = [];

  const filteredTopics = manifest.topics
    .filter(t => activeTopic === "ALL" || t.name === activeTopic)
    .map(t => ({
      name: t.name,
      assignments: t.assignments.filter(a => {
        if (!q) return true;
        const hay = [
          t.name, a.name,
          ...a.images.map(x => x.name),
          ...a.blends.map(x => x.name),
          ...a.videos.map(x => x.name),
        ].join(" ").toLowerCase();
        return hay.includes(q);
      })
    }))
    .filter(t => t.assignments.length > 0);

  if (!filteredTopics.length) {
    contentEl.innerHTML = `<div class="empty">Ничего не найдено по текущему фильтру.</div>`;
    return;
  }

  contentEl.innerHTML = filteredTopics.map((topic, tIdx) => {
    const cardsHtml = topic.assignments.map((a, aIdx) => {
      const cardId = `card-${tIdx}-${aIdx}`;
      const mediaStartIdx = flatMedia.length;
      a.images.forEach(img => flatMedia.push({ kind: "image", topic: topic.name, assign: a.name, ...img }));
      a.videos.forEach(vid => flatMedia.push({ kind: "video", topic: topic.name, assign: a.name, ...vid }));

      let previewHtml = `<div class="preview-box"><div class="no-render">Нет PNG-рендера<br>(только .blend модель)</div></div>`;
      if (a.images.length > 0) {
        const first = a.images[0];
        const badge = a.images.length > 1 ? `<span class="multi-badge">1 / ${a.images.length}</span>` : "";
        previewHtml = `
          <div class="preview-box" id="${cardId}-stage" onclick="openLightbox(${mediaStartIdx})">
            <img src="${first.url}" alt="${first.name}" loading="lazy" />
            ${badge}
          </div>`;
      } else if (a.videos.length > 0) {
        const firstVid = a.videos[0];
        previewHtml = `
          <div class="preview-box" onclick="openLightbox(${mediaStartIdx})">
            <div class="no-render">🎬 Видео ${firstVid.name}<br>(нажмите для просмотра / скачивания)</div>
          </div>`;
      }

      const thumbsHtml = a.images.length > 1 ? `
        <div class="thumbs">
          ${a.images.map((img, i) => `
            <div class="thumb ${i === 0 ? "active" : ""}" onclick="switchCardImage('${cardId}', ${i}, ${mediaStartIdx + i}, '${img.url.replace(/'/g, "\\'")}', '${img.name.replace(/'/g, "\\'")}', ${a.images.length}, this)">
              <img src="${img.url}" alt="${img.name}" loading="lazy" />
            </div>
          `).join("")}
        </div>` : "";

      const blendChips = a.blends.map(b =>
        b.url
          ? `<a class="chip clickable blend" href="${b.url}" download="${b.name}" title="Скачать / открыть .blend">🧊 ${b.name} <small>${b.size}</small></a>`
          : `<span class="chip blend" title="Файл лежит в локальной папке «Инфа 3д»">🧊 ${b.name} <small>${b.size}</small></span>`
      ).join("");
      const videoChips = a.videos.map((v, i) => {
        const idx = mediaStartIdx + a.images.length + i;
        return `<button class="chip clickable video" onclick="openLightbox(${idx})">🎬 ${v.name} <small>${v.size}</small></button>`;
      }).join("");
      const folderLink = a.folderUrl ? `<a class="folder-link" href="${a.folderUrl}/" target="_blank">папка ↗</a>` : "";

      return `
        <article class="card">
          ${previewHtml}
          ${thumbsHtml}
          <div class="card-body">
            <div class="card-title-row">
              <h3 class="card-title">${a.name}</h3>
              ${folderLink}
            </div>
            <div class="files-row">${blendChips}${videoChips}</div>
          </div>
        </article>`;
    }).join("");

    return `
      <section class="topic-section">
        <div class="topic-header">
          <h2 class="topic-title">${topic.name}</h2>
          <span class="topic-count">Заданий: ${topic.assignments.length}</span>
        </div>
        <div class="grid">${cardsHtml}</div>
      </section>`;
  }).join("");
}

function selectTopic(id) {
  activeTopic = id;
  renderAll();
}

function switchCardImage(cardId, imgIndex, flatIdx, url, name, total, thumbEl) {
  const stage = document.getElementById(`${cardId}-stage`);
  if (!stage) return;
  stage.innerHTML = `<img src="${url}" alt="${name}" />` + (total > 1 ? `<span class="multi-badge">${imgIndex + 1} / ${total}</span>` : "");
  stage.onclick = () => openLightbox(flatIdx);
  thumbEl.parentElement.querySelectorAll(".thumb").forEach(s => s.classList.remove("active"));
  thumbEl.classList.add("active");
}

function openLightbox(idx) {
  if (idx < 0 || idx >= flatMedia.length) return;
  currentLbIndex = idx;
  const item = flatMedia[idx];
  const stage = document.getElementById("lb-stage");
  const meta = document.getElementById("lb-meta");
  const openBtn = document.getElementById("lb-open");

  meta.textContent = `${item.topic} › ${item.assign} › ${item.name} (${item.size})`;
  if (item.url) {
    openBtn.style.display = "inline-flex";
    openBtn.href = item.url;
  } else {
    openBtn.style.display = "none";
  }

  if (item.kind === "video") {
    stage.innerHTML = item.url
      ? `<video src="${item.url}" controls autoplay loop onerror="this.nextElementSibling.style.display='block'"></video>
         <div style="display:none;color:#ffd2b2;font-size:13px;text-align:center">Контейнер .avi может не воспроизводиться прямо в браузере — нажмите «Скачать ↗» или откройте на ПК.</div>`
      : `<div style="color:#8f9bb3">Видео хранится в локальной папке «Инфа 3д».</div>`;
  } else {
    stage.innerHTML = `<img src="${item.url}" alt="${item.name}" />`;
  }
  document.getElementById("lightbox").classList.add("open");
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lb-stage").innerHTML = "";
  if (pendingManifestUpdate) {
    pendingManifestUpdate = false;
    renderAll();
    showToast("✨ Галерея обновлена новыми файлами.");
  }
}

function stepLightbox(delta) {
  if (!flatMedia.length) return;
  currentLbIndex = (currentLbIndex + delta + flatMedia.length) % flatMedia.length;
  openLightbox(currentLbIndex);
}

document.addEventListener("keydown", (e) => {
  const lb = document.getElementById("lightbox");
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") stepLightbox(-1);
  else if (e.key === "ArrowRight") stepLightbox(1);
});

document.getElementById("search").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  renderAll();
});

let lbTouchX = null, lbTouchY = null;
const lbEl = document.getElementById("lightbox");
lbEl.addEventListener("touchstart", (e) => {
  if (e.touches && e.touches.length === 1) {
    lbTouchX = e.touches[0].clientX;
    lbTouchY = e.touches[0].clientY;
  }
}, { passive: true });
lbEl.addEventListener("touchend", (e) => {
  if (lbTouchX === null || !e.changedTouches || !e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - lbTouchX;
  const dy = e.changedTouches[0].clientY - lbTouchY;
  lbTouchX = lbTouchY = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
    stepLightbox(dx < 0 ? 1 : -1);
  }
}, { passive: true });

(async function init() {
  lastSignature = manifestSignature(manifest);
  updateAutoButton();
  renderAll();
  if (location.protocol !== "file:") {
    await loadFromGitHubLive(false);
    scheduleAutoPoll();
  }
})();
</script>
</body>
</html>
